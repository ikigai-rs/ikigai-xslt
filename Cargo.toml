[package]
name = "ikigai-xslt"
# 0.5.0 REFUSES (typed InvalidArgument naming `src` or `stylesheet`) a prefixed attribute whose
# value xrust 2.3.0 would silently lowercase (ledger #2519). Input 0.4.x accepted is now refused,
# so this is a minor release: a consumer pinned "0.4.0" does not take it at a lock update.
# 0.4.1: request arguments reach declared top-level xsl:param values (ledger #2521); the core
# floor rises to 0.2.5, where a reference argument is settled by the kernel (ledger #2511).
# Unpublished 0.5.0 also refuses attribute whitespace character references, literal attributes
# without a result namespace declaration, and value-of whose boolean type cannot be safely
# adapted (#2520). These are additional refusals of input the earlier 0.5.0 accepted.
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Brian Sletten <brian.sletten@gmail.com>"]
description = "XSLT transformation as an ikigai resource (urn:xslt:transform) — style arbitrary XML/RDF-XML with a stylesheet, both as cacheable resource references. Pure-Rust (xrust), wasm-ready."
repository = "https://github.com/ikigai-rs/ikigai-xslt"
homepage = "https://github.com/ikigai-rs/ikigai-xslt"
keywords = ["ikigai", "roc", "xslt", "xml", "transform"]

# rlib for normal linking (the CLI, the uds examples); cdylib so `--features module` on
# wasm32 builds this library *as its own* lazy-loadable module artifact (ikigai_xslt.wasm).
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# 0.2.5: the kernel settles a by-reference argument by the target's contract (ledger #2511), so a
# stylesheet parameter (an open argument) passed as a reference receives the referent's text; the
# parameters test pins that BEHAVIOR floor. Beneath it, 0.2.0 is the streams release (ledger #2261). The old `0.1.89` pin meant <0.2.0 under 0.x
# rules, so this is a breaking move: core's types are in this crate's API (hence 0.4.0).
# (0.1.89 had been the floor: it added `space_iri` and made `bind` drop a space's name, so
# `space()` can name itself last, ledger #987.)
ikigai-core = "0.2.5"
async-trait = "0.1"
# 2.3.0 is the floor, and it is an API break INSIDE the caret (ledger #1492): xrust 2.3.0
# removed `Context::populate_key_values` (`key()` now indexes lazily), made
# `ParseError::MissingNameSpace` a struct variant, and moved to qualname 0.0.2. So nothing
# below 2.3 compiles this crate, and every ikigai-xslt through 0.3.0 (`xrust = "2.1.0"`) stopped
# building on a fresh resolve the day 2.3.0 shipped. ⚠ The caret admits a later 2.x, which may
# break the same way: a fresh-resolve build is the only thing that would notice.
xrust = "2.3.0"
# Only to NAME the types in xrust's `Node` trait, which `src/node_id.rs` implements (ledger
# #1047): xrust does not re-export them. It must be the qualname xrust itself depends on — 0.0.1
# for xrust 2.1 and 2.2, 0.0.2 for xrust 2.3 — and a `^0.0.2` pin is exactly `=0.0.2`. If a
# later xrust moves to another qualname, this crate stops COMPILING (two `QName` types), loudly,
# rather than drifting; that is how the 2.3.0 move showed up (E0053/E0308 in `src/node_id.rs`).
qualname = "0.0.2"

# The `module` feature turns this library into a standalone dynamically-loadable WASM
# module via `ikigai_module::wasm_module!` — so a host can lazy-load `ikigai_xslt.wasm` and
# resolve `urn:xslt:transform` against it. These deps are optional and behind the feature,
# so a normal (native/linked) consumer of the library never pulls wasm-bindgen et al.
[dependencies.ikigai-module]
# 0.5.1 is the newest release; the 0.5 line is ikigai-module's first on ikigai-core 0.2
# (`ikigai-core ^0.2.0`), and 0.4.0 and older link a 0.1 core beside this crate's 0.2 one. ⚠ A `^0.5.1` pin is also a CEILING (<0.6.0).
version = "0.5.1"
optional = true
[dependencies.wasm-bindgen]
# EXACT on purpose (ledger #1342, after ikigai-jsonld's #1193), unlike every other pin here.
# The `module` feature is built with THIS crate as the root package and post-processed by a
# `wasm-bindgen` CLI: ikigai-web-demo's pages.yml ("Build XSLT module WASM + JS bindings
# into dist/") checks this repo out at XSLT_REV, builds it with no lock (none is committed),
# and runs the wasm-bindgen-cli 0.2.108 it installs (`tool: wasm-bindgen-cli@0.2.108`) over
# `ikigai_xslt.wasm`. The CLI refuses a wasm whose library carries a different bindgen
# SCHEMA_VERSION (0.2.108's is 0.2.107; 0.2.128 and 0.2.129 carry 0.2.128), and under a
# caret the fresh resolve takes the newest 0.2.x. So this pin is the only thing tying the two
# together; bump it in step with that CLI pin (and the other `=0.2.108` crates beside it:
# ikigai-jsonld, ikigai-shacl, ikigai-web-demo), never alone.
# It costs native consumers nothing: the dependency is optional and only `module` enables
# it, so a crate linking ikigai-xslt (ikigai-cms-web, for one) never resolves it.
version = "=0.2.108"
optional = true
[dependencies.wasm-bindgen-futures]
version = "0.4"
optional = true
[dependencies.js-sys]
version = "0.3"
optional = true
[dependencies.futures]
version = "0.3"
optional = true
[dependencies.console_error_panic_hook]
version = "0.1"
optional = true

[features]
# Build this library as its own lazy-loadable WASM module:
#   cargo build --release --lib --features module --target wasm32-unknown-unknown
module = [
    "dep:ikigai-module",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
    "dep:futures",
    "dep:console_error_panic_hook",
]

[dev-dependencies]
futures = "0.3"
# For the `uds-server` / `uds-client` examples: run this XSLT space as a standalone
# out-of-process module behind a Unix socket. A dev-dependency, so it never enters the
# published library's dependency graph. Same pin as the optional dependency above.
ikigai-module = "0.5.1"
# The module recipe as one test (`tests/conformance.rs`): walks `space()` and reports
# every violation at once. 0.9.0 adds core 0.1.105's contract-shape checks (REQUIRED probes
# input groups, OUTPUTS honors output_from, PIPELINE's named-only line, VALIDATE refuses a
# default on a binding) and RECOMPUTE; 0.10.0 adds FAILURES; 0.11.0 moves onto ikigai-core
# 0.2.0 and turns FAILURES and DATATYPES on by default; 0.12.0 turns BODIES and BODY-INPUTS
# on (the walks pass `Suite::body_space`; no argument is `reads_body`, so no content store).
# The caret reads as a range, >=0.12.0 <0.13.0.
ikigai-conformance = "0.12.0"
